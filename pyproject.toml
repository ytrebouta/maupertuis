[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maupertuis"
version = "0.1.0"
description = "TUI module with simple layout management"
readme = "README.md"
license = "MIT"
authors = [{ name = "ytrebouta" }]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Repository = "https://github.com/ytrebouta/maupertuis"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maupertuis"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
